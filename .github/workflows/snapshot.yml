# ═══════════════════════════════════════════════════════════════════
# MANTEWORK · Snapshot automático de avisos.json + keepalive Supabase
# ───────────────────────────────────────────────────────────────────
# Qué hace, cada 6 horas y sin intervención humana:
#   1. Lee los avisos desde Supabase (misma consulta que hace el sitio)
#   2. Genera avisos.json con SOLO los campos públicos (sin zona de
#      mercado ni datos internos) — misma lógica que el botón del panel
#   3. Si cambió respecto al que está publicado, lo commitea al repo
#      → GitHub Pages lo despliega solo
#   4. De regalo: la consulta periódica mantiene ACTIVO el proyecto
#      Supabase gratuito (keepalive) — ya no se pausa por inactividad
#
# Instalación: subir este archivo al repo en la ruta EXACTA:
#   .github/workflows/snapshot.yml
# No requiere secrets: la anon key se lee del propio index.html del
# repo (ya es pública por diseño — viaja en cada visita al sitio).
# ═══════════════════════════════════════════════════════════════════
name: Snapshot avisos.json

on:
  schedule:
    - cron: '0 */6 * * *'   # cada 6 horas (UTC)
  workflow_dispatch:         # permite ejecutarlo a mano desde la pestaña Actions

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Generar avisos.json desde Supabase
        run: |
          python3 << 'PYEOF'
          import json, re, urllib.request, sys, datetime

          # Credenciales: extraídas del propio index.html (anon key pública de solo lectura)
          html = open('index.html', encoding='utf-8').read()
          url  = re.search(r"SUPABASE_URL = '([^']+)'", html).group(1)
          key  = re.search(r"SUPABASE_KEY = '([^']+)'", html).group(1)

          req = urllib.request.Request(
              url + '/rest/v1/mantework_datos?id=eq.1&select=pack',
              headers={'apikey': key, 'Authorization': 'Bearer ' + key})
          with urllib.request.urlopen(req, timeout=30) as r:
              filas = json.load(r)

          if not filas or not filas[0].get('pack'):
              print('Sin datos en la nube — no se toca el snapshot existente.')
              sys.exit(0)

          pack = filas[0]['pack']
          avisos = pack.get('avisos', [])

          # Mismos campos públicos que el botón del panel (v3.18.30)
          CAMPOS = ['id','cargo','empresa','verEmpresa','region','ciudad','lugar',
                    'turno','contrato','experiencia','requisitos','grupo','estado',
                    'fechaAprobacion','linkCorto','postula','plan']
          pub = []
          for a in avisos:
              if a.get('estado') != 'activo':
                  continue
              fila = {k: a[k] for k in CAMPOS if a.get(k) is not None}
              fc = (a.get('mercado') or {}).get('fcierre')
              if fc:
                  fila['mercado'] = {'fcierre': fc}
              pub.append(fila)

          if not pub:
              print('Cero avisos activos en la nube — no se sobreescribe el snapshot.')
              sys.exit(0)

          nuevo = {'generado': datetime.datetime.now(datetime.timezone.utc).isoformat(),
                   'version': pack.get('version', ''),
                   'avisos': pub}

          # Comparar SOLO los avisos (el timestamp cambia siempre): commit solo si hay cambios reales
          try:
              viejo = json.load(open('avisos.json', encoding='utf-8'))
              if json.dumps(viejo.get('avisos'), sort_keys=True, ensure_ascii=False) == \
                 json.dumps(pub, sort_keys=True, ensure_ascii=False):
                  print(f'Sin cambios en los avisos ({len(pub)} activos) — keepalive cumplido, nada que commitear.')
                  sys.exit(0)
          except FileNotFoundError:
              pass

          json.dump(nuevo, open('avisos.json', 'w', encoding='utf-8'),
                    ensure_ascii=False, indent=1)
          print(f'avisos.json regenerado: {len(pub)} avisos activos.')
          PYEOF

      - name: Commitear si cambió
        run: |
          git config user.name "mantework-bot"
          git config user.email "actions@github.com"
          if git diff --quiet avisos.json 2>/dev/null && git ls-files --error-unmatch avisos.json >/dev/null 2>&1; then
            echo "Sin cambios — no se commitea."
          else
            git add avisos.json
            git commit -m "Snapshot automático de avisos.json ($(date -u +%Y-%m-%d\ %H:%M) UTC)" || echo "Nada que commitear."
            git push
          fi
